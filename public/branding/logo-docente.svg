<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <!-- SJD Granada & Cruz Emblem -->
  <g transform="translate(10, 10)">
    <!-- Shield / Base Badge -->
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#E30613" />
    <circle cx="40" cy="40" r="32" fill="#FFFFFF" fill-opacity="0.12" />
    <!-- Cruz Hospitalaria estilizada -->
    <path d="M40 16 V64 M22 34 H58" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" />
    <!-- Granada de San Juan de Dios -->
    <circle cx="40" cy="48" r="14" fill="#FFFFFF" />
    <path d="M40 34 L43 40 L48 40 L44 44 L46 50 L40 46 L34 50 L36 44 L32 40 L37 40 Z" fill="#E30613" />
  </g>

  <!-- Typography -->
  <g transform="translate(104, 18)">
    <!-- Sant Joan de Déu header -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#111827" letter-spacing="-0.02em">
      Campus Docent
    </text>
    <text x="146" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0077B6" letter-spacing="-0.01em">
      Sant Joan de Déu
    </text>
    
    <!-- Application Sub-brand -->
    <rect x="0" y="34" width="380" height="1.5" fill="#E2E8F0" />
    
    <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E30613" letter-spacing="0.04em">
      AulaCIM-10 · FHSJD
    </text>
    <rect x="156" y="44" width="76" height="16" rx="4" fill="#E0F2FE" />
    <text x="162" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0369A1">
      DAS 26/27
    </text>
  </g>
</svg>
